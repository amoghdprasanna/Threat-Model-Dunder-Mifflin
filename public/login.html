<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dunder Mifflin | Login</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-left: 10%;
      background: url('https://wallpapers.com/images/high/the-office-background-rak6btfog0un34th.webp') no-repeat right center / cover;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(10px) brightness(0.7);
      -webkit-backdrop-filter: blur(10px) brightness(0.7);
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      color: #fff;
      text-align: center;
    }

    .logo {
      width: 180px;
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #fff;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      display: block;
      color: #f0f0f0;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      outline: none;
    }

    input::placeholder {
      color: #ddd;
    }

    input:focus {
      border: 1px solid #2ea8e6;
      background: rgba(255, 255, 255, 0.28);
    }

    .btn-login {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      background: #003366;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-login:hover {
      background: #00509e;
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .btn-login:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .login-footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #ddd;
    }

    .login-footer a {
      color: #aee3ff;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* Alert styles */
    .alert {
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      animation: slideIn 0.3s ease;
    }

    .alert-danger {
      background: rgba(220, 53, 69, 0.3);
      border: 1px solid rgba(220, 53, 69, 0.5);
      color: #fff;
    }

    .alert-success {
      background: rgba(40, 167, 69, 0.3);
      border: 1px solid rgba(40, 167, 69, 0.5);
      color: #fff;
    }

    .alert-warning {
      background: rgba(255, 193, 7, 0.3);
      border: 1px solid rgba(255, 193, 7, 0.5);
      color: #fff;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .back-link a {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
    }

    .back-link a:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Demo credentials helper */
    .demo-credentials {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      font-size: 0.75rem;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .demo-credentials h4 {
      margin-bottom: 0.5rem;
      color: #aee3ff;
      font-size: 0.85rem;
    }

    .demo-credentials ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .demo-credentials li {
      padding: 0.3rem 0;
      color: #ddd;
      font-family: 'Courier New', monospace;
    }

    .demo-credentials .role {
      color: #aee3ff;
      font-weight: bold;
      display: inline-block;
      width: 140px;
    }

    @media (max-width: 480px) {
      body {
        padding-left: 0;
        justify-content: center;
      }
      
      .login-card {
        margin: 1rem;
        padding: 1.5rem;
      }

      .back-link {
        top: 10px;
        left: 10px;
      }
    }
  </style>
</head>

<body>
  <!-- Back to Home Link -->
  <div class="back-link">
    <a href="index.html">← Back to Home</a>
  </div>

  <div class="login-card">
    <!-- Logo -->
    <img src="https://m.media-amazon.com/images/I/51MlenT-i+L._AC_.jpg" alt="Dunder Mifflin Logo" class="logo">

    <h2>Employee Login</h2>

    <!-- Alert Container -->
    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Login</button>
    </form>

    <!-- Demo Credentials Helper -->
    <div class="demo-credentials">
      <h4>📋 Demo Accounts:</h4>
      <ul>
        <li><span class="role">Administrator:</span> admin / Admin123!</li>
        <li><span class="role">Manager:</span> mscott / Manager123!</li>
        <li><span class="role">Employee:</span> dwight / Employee123!</li>
        <li><span class="role">Sales:</span> jim / Sales123!</li>
      </ul>
    </div>

    <div class="login-footer">
      © 2025 Dunder Mifflin Inc. | <a href="index.html#contact">Need Help?</a>
    </div>
  </div>

  <script>
    // API Configuration
    const API_BASE_URL = 'http://localhost:3000/api/v1';

    /**
     * Display alert message
     */
    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = 'alert alert-' + type;
      alertBox.style.display = 'block';
      
      // Auto-hide after 5 seconds
      setTimeout(function() {
        alertBox.style.display = 'none';
      }, 5000);
    }

    /**
     * Store user session data
     */
    function storeSession(data) {
      // Store in sessionStorage
      sessionStorage.setItem('user', data.user.username);
      sessionStorage.setItem('userId', data.user.user_id);
      sessionStorage.setItem('role', data.user.role);
      sessionStorage.setItem('email', data.user.email);
      sessionStorage.setItem('sessionId', data.session_id);
      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('loginTime', new Date().toISOString());
      sessionStorage.setItem('expiresAt', data.expires_at);
      
      console.log('✓ Session stored:', {
        user: data.user.username,
        role: data.user.role,
        sessionId: data.session_id
      });
    }

    /**
     * Handle API errors
     */
    function handleApiError(error, response) {
      console.error('API Error:', error);
      
      if (!response) {
        return 'Unable to connect to server. Please ensure the backend is running on http://localhost:3000';
      }
      
      // Handle specific error codes from backend
      switch(error.code) {
        case 'INVALID_CREDENTIALS':
          return 'Invalid username or password. Please try again.';
        case 'ACCOUNT_LOCKED':
          const lockedUntil = new Date(error.locked_until);
          const minutes = Math.ceil((lockedUntil - new Date()) / 60000);
          return `Account locked due to too many failed attempts. Try again in ${minutes} minutes.`;
        case 'ACCOUNT_DISABLED':
          return 'Your account has been disabled. Please contact your administrator.';
        case 'MISSING_CREDENTIALS':
          return 'Please enter both username and password.';
        default:
          return error.error || 'Login failed. Please try again.';
      }
    }

    /**
     * Authenticate with backend API
     */
    async function authenticateUser(username, password) {
      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include', // Important: Include cookies
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          return { success: true, data: data };
        } else {
          return { success: false, error: data, response: response };
        }
      } catch (error) {
        console.error('Network error:', error);
        return { 
          success: false, 
          error: { 
            error: 'Network error. Please check if the backend server is running.',
            code: 'NETWORK_ERROR' 
          },
          response: null
        };
      }
    }

    /**
     * Handle login form submission
     */
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      
      // Get form values
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const loginBtn = document.getElementById("loginBtn");
      
      // Basic validation
      if (!username || !password) {
        showAlert("Please enter both username and password.", "danger");
        return;
      }

      // Disable button during login
      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      console.log('→ Attempting login for:', username);

      // Authenticate with backend
      const result = await authenticateUser(username, password);

      if (result.success) {
        // Successful login
        console.log('✓ Login successful:', result.data.user);
        
        // Clear any existing session first
        sessionStorage.clear();
        
        // Store new session data
        storeSession(result.data);
        
        // Show success message with role
        const role = result.data.user.role;
        showAlert(`Welcome, ${username}! (${role}) Redirecting...`, "success");
        
        // Redirect to inventory after 1 second
        setTimeout(function() {
          console.log('→ Redirecting to inventory...');
          window.location.replace("inventory.html");
        }, 1000);
      } else {
        // Failed login
        console.log('✗ Login failed:', result.error);
        
        const errorMessage = handleApiError(result.error, result.response);
        showAlert(errorMessage, "danger");
        
        // Re-enable button
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        
        // Clear password field
        document.getElementById("password").value = "";
      }
    });

    /**
     * Check if user is already logged in
     */
    window.addEventListener('DOMContentLoaded', async function() {
      const sessionId = sessionStorage.getItem('sessionId');
      const loggedIn = sessionStorage.getItem('loggedIn');
      
      if (loggedIn === 'true' && sessionId) {
        const username = sessionStorage.getItem('user');
        console.log('→ User already logged in, verifying session...');
        
        // Verify session is still valid with backend
        try {
          const response = await fetch(`${API_BASE_URL}/auth/me`, {
            credentials: 'include'
          });
          
          if (response.ok) {
            const userData = await response.json();
            console.log('✓ Session valid, redirecting...');
            showAlert("Already logged in as " + username + ". Redirecting...", "success");
            
            setTimeout(function() {
              window.location.href = "inventory.html";
            }, 1000);
          } else {
            // Session expired, clear it
            console.log('✗ Session expired, clearing...');
            sessionStorage.clear();
          }
        } catch (error) {
          console.error('Error verifying session:', error);
          // Keep the login form visible if we can't verify
        }
      }
    });

    /**
     * Enter key to submit
     */
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        document.getElementById("loginForm").dispatchEvent(new Event('submit'));
      }
    });

    /**
     * Quick fill demo credentials (for development)
     */
    document.addEventListener('keydown', function(e) {
      // Press Ctrl+Shift+1/2/3/4 to quick-fill credentials
      if (e.ctrlKey && e.shiftKey) {
        let username = '', password = '';
        
        switch(e.key) {
          case '1': // Admin
            username = 'admin';
            password = 'Admin123!';
            break;
          case '2': // Manager
            username = 'mscott';
            password = 'Manager123!';
            break;
          case '3': // Employee
            username = 'dwight';
            password = 'Employee123!';
            break;
          case '4': // Sales
            username = 'jim';
            password = 'Sales123!';
            break;
        }
        
        if (username) {
          document.getElementById('username').value = username;
          document.getElementById('password').value = password;
          console.log('→ Quick-filled credentials for:', username);
        }
      }
    });

    /**
     * Check backend availability on load
     */
    async function checkBackend() {
      try {
        const response = await fetch(`${API_BASE_URL}/health`);
        const data = await response.json();
        
        if (data.status === 'healthy') {
          console.log('✓ Backend server is running');
        } else {
          console.warn('⚠ Backend server returned unhealthy status');
        }
      } catch (error) {
        console.error('✗ Backend server is not reachable. Make sure it is running on http://localhost:3000');
        showAlert('⚠ Warning: Backend server not detected. Authentication will not work until the server is started.', 'warning');
      }
    }

    // Check backend on page load
    checkBackend();
  </script>
</body>

</html>
