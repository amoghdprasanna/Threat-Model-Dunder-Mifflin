<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Debug</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #f5f5f5;
    }
    .info {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-success { background: #28a745; color: white; }
    pre {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🔍 Session Debug Tool</h1>
  
  <div class="info">
    <h3>Current Session Status</h3>
    <pre id="sessionInfo">Loading...</pre>
  </div>

  <div class="info">
    <h3>Actions</h3>
    <button class="btn btn-success" onclick="setTestSession()">Set Test Session (admin)</button>
    <button class="btn btn-danger" onclick="clearSession()">Clear Session</button>
    <button class="btn btn-primary" onclick="refreshInfo()">Refresh Info</button>
    <button class="btn btn-primary" onclick="goToInventory()">Go to Inventory</button>
    <button class="btn btn-primary" onclick="goToLogin()">Go to Login</button>
  </div>

  <script>
    function refreshInfo() {
      const info = {
        loggedIn: sessionStorage.getItem('loggedIn'),
        user: sessionStorage.getItem('user'),
        loginTime: sessionStorage.getItem('loginTime'),
        allKeys: Object.keys(sessionStorage),
        timestamp: new Date().toISOString()
      };
      
      document.getElementById('sessionInfo').textContent = JSON.stringify(info, null, 2);
      console.log('Session Info:', info);
    }

    function setTestSession() {
      sessionStorage.setItem('user', 'admin');
      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('loginTime', new Date().toISOString());
      alert('Test session set for user: admin');
      refreshInfo();
    }

    function clearSession() {
      sessionStorage.clear();
      alert('Session cleared');
      refreshInfo();
    }

    function goToInventory() {
      window.location.href = 'inventory.html';
    }

    function goToLogin() {
      window.location.href = 'login.html';
    }

    // Auto-refresh on load
    refreshInfo();
  </script>
</body>
</html>
